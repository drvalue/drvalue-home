# 운영 한 벌 — 컨테이너 둘: web(Next, 공개 화면 + /admin) · api(Nest).
# DB 는 컨테이너 밖이다(운영: iwinv 관리형 PostgreSQL). 주소·이름·계정은 루트 .env.
#
#   운영 서버:   docker compose up -d --build
#   로컬 개발:   .env 에 COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml (db 컨테이너 + 포트)
#
# 밖에서 닿는 것은 web 하나, 그것도 127.0.0.1 로만 연다 — 서버 앞단(nginx)이 HTTPS 로 받아 넘긴다.
# api 는 포트를 내지 않는다. web → api 는 compose 망 안에서 http://api:3500.
name: drvalue

services:
  web:
    build:
      context: ./web
      args:
        # 미리보기 배포에서만 NOINDEX=1 로 검색을 막는다. 운영에는 넣지 않는다.
        NOINDEX: ${NOINDEX:-}
        # /api 프록시 주소는 빌드 때 굳는다(web/Dockerfile). 실행 환경값과 같게 둔다.
        API_ORIGIN: http://api:3500
        # 방문 통계 GTM id(빌드 때 굳는다). 비면 GTM·동의 창이 안 실린다.
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
    image: drvalue/web
    container_name: drvalue_web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      API_ORIGIN: http://api:3500
    ports:
      # 앞단 프록시만 닿게 127.0.0.1. 3400 을 다른 것이 쓰면 WEB_PORT=3410 처럼 바꾼다
      # (그때는 ADMIN_IAM_CALLBACK_URL 도 같은 주소로).
      - '127.0.0.1:${WEB_PORT:-3400}:3400'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3400/']
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      # 스키마·마이그레이션(db/)을 이미지에 싣는다. api 는 뜰 때 먼저 스키마를 맞춘다.
      additional_contexts:
        db: ./db
    image: drvalue/api
    container_name: drvalue_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3500
      UPLOADS_DIR: /data/uploads
      # 앞에 서는 것이 web(Next) 하나라 홉 1. 앞단 nginx 가 X-Forwarded-For 를 접속 IP 로 덮어써야
      # 이 값이 맞다(docs/operations.md 「앞단 프록시」). 덧붙이기($proxy_add_x_forwarded_for)면 위조된다.
      TRUST_PROXY: 1
    volumes:
      - ./data/uploads:/data/uploads
    # 무인증 · DB 를 읽는 가벼운 끝점. 이게 200 이면 api 와 DB 연결이 둘 다 산 것이다.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3500/api/content/menu']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
