# 디알밸류 홈페이지 한 벌 — 홈페이지(web) · API(api) · CMS(directus + db).
#
#   docker compose up -d --build          # 넷 다
#   docker compose up -d --build web api  # CMS 는 이미 떠 있을 때
#   docker compose logs -f web api
#
# 포트는 로컬 개발과 같다: web 3400 · api 3500 · directus 3350 · db 3330.
# CMS 정의는 cms/docker-compose.yml 그대로 가져온다(include) — 컨테이너·볼륨 이름이
# 거기 고정돼 있어 지금 도는 drvalue_directus 와 데이터가 그대로 이어진다.
#
# 비밀값은 저장소에 없다. 루트 .env 하나를 .env.example 대로 만든다.
# 컨테이너끼리는 서비스 이름으로 부른다: web → api 는 http://api:3500,
# api → directus 는 http://directus:8055 (아래 environment 가 .env 값을 덮는다).
name: drvalue

include:
  - path: cms/docker-compose.yml
    project_directory: cms
    env_file: .env

services:
  web:
    build:
      context: ./web
      # 미리보기 배포에서만 NOINDEX=1 로 검색을 막는다. 운영에는 넣지 않는다.
      args:
        NOINDEX: ${NOINDEX:-}
    image: drvalue/web
    container_name: drvalue_web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      API_ORIGIN: http://api:3500
    ports:
      - '3400:3400'
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3400/']
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    image: drvalue/api
    container_name: drvalue_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3500
      DIRECTUS_URL: http://directus:8055
      # nginx 같은 프록시 뒤에 두면 1 — main.ts 의 경고 참조.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - '3500:3500'
    depends_on:
      directus:
        condition: service_healthy
