# 서버 앞단 nginx — /etc/nginx/sites-available/drvalue 에 두고 sites-enabled 로 잇는다.
# 인증서는 certbot(`certbot --nginx -d drvalue.co.kr -d www.drvalue.co.kr`)이 아래 ssl_* 줄을 채운다.
#
# 지키는 것:
#  - 밖에서 닿는 것은 443(과 80 → 443 넘김) 뿐. web 은 127.0.0.1:3400, api·DB 는 밖에 없다.
#  - X-Forwarded-For 는 **접속 IP 로 덮어쓴다**($remote_addr). $proxy_add_x_forwarded_for(덧붙이기)로
#    바꾸면 방문자가 보낸 가짜 IP 가 앞에 남고 문의 속도 제한(IP 당 분 5회)이 우회된다(실측).
#  - 업로드는 영상 200MB 까지 — client_max_body_size 가 그보다 커야 한다.

server {
    listen 80;
    listen [::]:80;
    server_name drvalue.co.kr www.drvalue.co.kr;
    location / { return 301 https://drvalue.co.kr$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name drvalue.co.kr www.drvalue.co.kr;

    # ssl_certificate     /etc/letsencrypt/live/drvalue.co.kr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/drvalue.co.kr/privkey.pem;

    if ($host = www.drvalue.co.kr) { return 301 https://drvalue.co.kr$request_uri; }

    client_max_body_size 210m;
    # 큰 업로드를 nginx 가 디스크에 모았다 넘기지 않고 흘려보낸다(web 이 스트림으로 api 에 넘긴다).
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
