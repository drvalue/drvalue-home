# 서버 앞단 nginx — /etc/nginx/sites-available/drvalue 에 두고 sites-enabled 로 잇는다.
#
# 처음에는 80 만 둔다. `sudo certbot --nginx -d drvalue.co.kr -d www.drvalue.co.kr --redirect` 가
# 인증서를 받아 이 블록을 443 으로 복제하고(아래 proxy 설정을 그대로 가져간다) 80 은 443 넘김으로 바꾼다.
# 갱신도 certbot 이 한다. 인증서 없이 `listen 443 ssl` 을 먼저 두면 nginx -t 가 실패해 certbot 이 못 돈다.
#
# 지키는 것:
#  - 밖에서 닿는 것은 이 nginx 뿐. web 은 127.0.0.1:3400, api·DB 는 밖에 없다.
#  - X-Forwarded-For 는 **접속 IP 로 덮어쓴다**($remote_addr). $proxy_add_x_forwarded_for(덧붙이기)로
#    바꾸면 방문자가 보낸 가짜 IP 가 남아 문의 속도 제한(IP 당 분 5회)이 우회된다(실측).
#  - 업로드는 영상 200MB 까지 — client_max_body_size 가 그보다 커야 한다.

server {
    listen 80;
    listen [::]:80;
    server_name drvalue.co.kr www.drvalue.co.kr;

    client_max_body_size 210m;
    # 큰 업로드를 nginx 가 디스크에 모았다 넘기지 않고 흘려보낸다(web 이 스트림으로 api 에 넘긴다).
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
